spring.application.name=checkadv-resolvedor
server.port=${RESOLVEDOR_PORTA:8082}

# Liga as rotas /v/** (permite subir o mesmo artefato com o Resolvedor desligado)
app.link.habilitado=true

# Timeouts do proxy até a instância
app.link.timeout-conexao=2s
app.link.timeout-leitura=5s
# Atualização do mapa prefixo -> instância
app.link.intervalo-roteamento=45s

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never
