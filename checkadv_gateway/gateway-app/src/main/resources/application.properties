spring.application.name=checkadv-gateway
server.port=${GATEWAY_PORTA:8081}

# Banco (MySQL 8.0+ ou MariaDB 10.6+, por causa do SKIP LOCKED)
spring.datasource.url=${GATEWAY_DB_URL:jdbc:mysql://localhost:3306/checkadv_gateway?serverTimezone=UTC}
spring.datasource.username=${GATEWAY_DB_USUARIO:checkadv_gateway}
spring.datasource.password=${GATEWAY_DB_SENHA:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Instant como DATETIME comum (UTC), compatível com as colunas DATETIME(3) e o ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true

# Autenticação HMAC (API v1 e admin)
app.hmac.janela-segundos=300
app.hmac.corpo-maximo-bytes=8192

# Chave mestra AES-256 (Base64). Obrigatória: sem ela a aplicação não sobe.
app.cripto.chave-mestra-id=${GATEWAY_CHAVE_MESTRA_ID:k1}
app.cripto.chave-mestra=${GATEWAY_CHAVE_MESTRA}

# Cotas (limite diário de quem ainda não tem plano definido)
app.cota.fuso=America/Sao_Paulo
app.cota.limite-diario-padrao=200

# Template único criado em cada WABA
app.whatsapp.template-nome=comunicacao_registrada
app.whatsapp.template-idioma=pt_BR

# Meta: "simulado" na Fase 1 (nenhuma mensagem real sai)
app.meta.modo=simulado
app.meta.simulado.atraso-entrega=2s
app.meta.simulado.atraso-leitura=5s
app.meta.simulado.aprovar-template=true

# Worker da fila de envio
app.worker.habilitado=true
app.worker.intervalo=1000
app.worker.lote=20
app.worker.threads=4
app.worker.lease=2m
app.worker.max-tentativas=5
app.worker.mensagens-por-segundo=20
app.worker.politica5xx=incerto
app.worker.retencao=7d

# Callbacks para as instâncias
app.callback.intervalo=2000
app.callback.timeout-conexao=3s
app.callback.timeout-leitura=5s
app.callback.prazo=24h
# Só em desenvolvimento local: aceita callback em http://
app.callback.permitir-http=${GATEWAY_CALLBACK_PERMITIR_HTTP:false}

spring.task.scheduling.pool.size=3

# Observabilidade (expor só na rede interna)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Nada de detalhe de erro para fora
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.pattern.level=%5p [%X{correlationId:-}]
